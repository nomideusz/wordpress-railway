ServerName localhost

# Railway's edge proxy connects from 100.64.0.0/10 and puts the visitor's address
# in X-Forwarded-For. The image trusts only the private ranges, so without this
# WordPress (comments, login limits, security plugins) sees every visitor as the proxy.
RemoteIPInternalProxy 100.64.0.0/10

# Railway's deploy health check: a static file, so it answers the same in any
# WordPress state and never redirects (WordPress would, for the checker's Host).
Alias /healthz /usr/local/share/railway/healthz
<Directory /usr/local/share/railway>
	Require all granted
</Directory>
